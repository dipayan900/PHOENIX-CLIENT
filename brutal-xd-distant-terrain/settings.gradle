pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // Fabric Loom injects its remapped-mod repository at project level.
    // PREFER_PROJECT allows Loom's repository while retaining these defaults.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.caffeinemc.net/releases" }
        mavenCentral()
    }
}

rootProject.name = "Brutal_XD-Distant-Terrain"
