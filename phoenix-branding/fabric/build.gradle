plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    include modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}
java { withSourcesJar(); toolchain { languageVersion = JavaLanguageVersion.of(21) } }


// Cosmetics are intentionally not part of Phoenix builds.
sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixCosmeticFeatureRenderer.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixCosmeticFeatureRendererModern.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixLoadoutPayload.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixLoadoutState.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityRendererMixin.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityRendererMixinModern.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityModelEmoteMixin.java'
sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityModelEmoteMixinModern.java'

if (project.minecraft_version != '1.21.1') {
    sourceSets.main.java.srcDir 'src/modern/java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixCosmeticFeatureRenderer.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityRendererMixin.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityModelEmoteMixin.java'
}
