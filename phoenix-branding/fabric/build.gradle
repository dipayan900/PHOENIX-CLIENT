plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    include modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}
java { withSourcesJar(); toolchain { languageVersion = JavaLanguageVersion.of(21) } }


// Phoenix cosmetic renderers and their mixins are included in every version adapter.

// The integrated 1.21.9+ adapters use the render-state API. Do not compile
// legacy entity-model renderers/mixins alongside their modern replacements.
if (project.hasProperty('phoenixIntegratedAdapters') &&
        project.minecraft_version in ['1.21.9', '1.21.10', '1.21.11']) {
    sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixCosmeticFeatureRenderer.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityRendererMixin.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityModelEmoteMixin.java'
}

if (project.minecraft_version != '1.21.1' && !project.hasProperty('phoenixIntegratedAdapters')) {
    // Standalone 1.21.11 branding build uses the modern source overlay.
    // The integrated launcher workflow copies its exact modern6/9/11 adapter into main instead.
    sourceSets.main.java.srcDir 'src/modern/java'
    // Compile the modern API variants instead of the legacy 1.21.1 copies.
    sourceSets.main.java.exclude { element ->
        def legacyFiles = [
            'src/main/java/net/phoenix/client/branding/PhoenixHud.java',
            'src/main/java/net/phoenix/client/branding/PhoenixHudEditorScreen.java',
            'src/main/java/net/phoenix/client/branding/mixin/EntityRendererMixin.java'
        ]
        legacyFiles.contains(element.file.path.replace('\\\\', '/').replace(project.projectDir.path + '/', ''))
    }
    sourceSets.main.java.exclude 'net/phoenix/client/branding/PhoenixCosmeticFeatureRenderer.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityRendererMixin.java'
    sourceSets.main.java.exclude 'net/phoenix/client/branding/mixin/PlayerEntityModelEmoteMixin.java'
}
