name: Build Phoenix Branding Add-ons
on:
  push:
    branches: ['feature/phoenix-cosmetics-integration', 'integration/amethyst-phoenix']
    paths: ['phoenix-branding/**', '.github/workflows/phoenix-branding.yml']
  pull_request:
    paths: ['phoenix-branding/**', '.github/workflows/phoenix-branding.yml']
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.1' }
      - name: Select Minecraft 1.21.11 local-skin adapter
        working-directory: phoenix-branding/fabric
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/main/java/net/phoenix/client/branding/mixin/LocalPlayerSkinMixin.java
          cp src/modern11/java/net/phoenix/client/branding/mixin/LocalPlayerSkinMixinModern.java src/main/java/net/phoenix/client/branding/mixin/LocalPlayerSkinMixinModern.java
          # 1.21.11 changed FeatureRenderer to the ordered command-queue API.
          # The standalone add-on build compiles src/modern, so replace that
          # renderer with the 1.21.11-specific implementation before compiling.
          cp src/modern11/java/net/phoenix/client/branding/PhoenixCosmeticFeatureRendererModern.java src/modern/java/net/phoenix/client/branding/PhoenixCosmeticFeatureRendererModern.java
          cp src/modern11/resources/phoenix_branding.mixins.json src/main/resources/phoenix_branding.mixins.json
          test ! -e src/main/java/net/phoenix/client/branding/mixin/LocalPlayerSkinMixin.java
          grep -q '"LocalPlayerSkinMixinModern"' src/main/resources/phoenix_branding.mixins.json
          test -s src/main/java/net/phoenix/client/branding/PhoenixLocalAppearance.java
          echo "Selected 1.21.11 SkinTextures adapter; legacy adapter excluded."
      - name: Build Fabric branding mod
        working-directory: phoenix-branding/fabric
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-branding-fabric-1.21.11
          path: phoenix-branding/fabric/build/libs/phoenix-branding-*.jar
          if-no-files-found: error
  paper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build Paper server plugin
        working-directory: phoenix-branding/paper
        run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-branding-paper-1.21.1
          path: phoenix-branding/paper/target/phoenix-branding-paper-0.2.0.jar
          if-no-files-found: error
