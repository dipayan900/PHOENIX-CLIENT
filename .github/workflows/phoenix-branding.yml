name: Build Phoenix Branding Add-ons
on:
  push:
    branches: ['feature/phoenix-cosmetics-integration']
    paths: ['phoenix-branding/**', '.github/workflows/phoenix-branding.yml']
  pull_request:
    paths: ['phoenix-branding/**', '.github/workflows/phoenix-branding.yml']
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12' }
      - name: Build Fabric branding mod
        working-directory: phoenix-branding/fabric
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-branding-fabric-1.21.1
          path: phoenix-branding/fabric/build/libs/phoenix-branding-*.jar
          if-no-files-found: error
  paper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build Paper server plugin
        working-directory: phoenix-branding/paper
        run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-branding-paper-1.21.1
          path: phoenix-branding/paper/target/phoenix-branding-paper-0.1.0.jar
          if-no-files-found: error
