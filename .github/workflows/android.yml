name: Build Phoenix Client (Integrated Java Engine)
on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenix-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build complete Phoenix test package
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout Phoenix project
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"
      - name: Set up Fabric Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Build Phoenix Fabric client mods for Minecraft 1.21.x
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/phoenix-fabric-assets"
          mkdir -p "$OUT"
          for MC_VERSION in 1.21.1; do
            echo "::group::Build Phoenix Fabric mod for Minecraft $MC_VERSION"
            DEPS="$(python3 scripts/resolve-fabric-versions.py "$MC_VERSION")"
            YARN_MAPPINGS="$(printf '%s\n' "$DEPS" | sed -n '1p')"
            FABRIC_API_VERSION="$(printf '%s\n' "$DEPS" | sed -n '2p')"
            test -n "$YARN_MAPPINGS"
            test -n "$FABRIC_API_VERSION"
            echo "Mappings: $YARN_MAPPINGS"
            echo "Fabric API: $FABRIC_API_VERSION"
            gradle --no-daemon -p phoenix-branding/fabric clean build \
              -Pminecraft_version="$MC_VERSION" \
              -Pyarn_mappings="$YARN_MAPPINGS" \
              -Ploader_version=0.18.1 \
              -Pfabric_version="$FABRIC_API_VERSION"
            JAR="$(find phoenix-branding/fabric/build/libs -maxdepth 1 -type f -name 'phoenix-branding-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
            test -n "$JAR"
            cp "$JAR" "$OUT/phoenix-branding-fabric-$MC_VERSION.jar"
            echo "::endgroup::"
          done
      - name: Checkout Amethyst Java engine source
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git "$RUNNER_TEMP/phoenix-engine"
          git -C "$RUNNER_TEMP/phoenix-engine" submodule status
      - name: Download OpenJDK 8 runtime bundle (attempt 1)
        id: download_jre_attempt_1
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Retry OpenJDK 8 runtime download (attempt 2)
        id: download_jre_attempt_2
        if: steps.download_jre_attempt_1.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Retry OpenJDK 8 runtime download (attempt 3)
        if: steps.download_jre_attempt_1.outcome != 'success' && steps.download_jre_attempt_2.outcome != 'success'
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Apply Phoenix branding and cosmetics UI
        run: bash scripts/prepare-phoenix-engine.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/phoenix-engine"
      - name: Embed all version-specific Phoenix Fabric mods into the Android launcher
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/phoenix-engine/app_pojavlauncher/src/main/assets/phoenix"
          mkdir -p "$ASSETS"
          cp "$RUNNER_TEMP"/phoenix-fabric-assets/phoenix-branding-fabric-*.jar "$ASSETS/"
          test "$(find "$ASSETS" -maxdepth 1 -name 'phoenix-branding-fabric-*.jar' | wc -l)" -eq 1
      - name: Generate upstream language resources
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: bash scripts/languagelist_updater.sh
      - name: Set up Android Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Build Phoenix Android APK
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: gradle --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Assemble one complete Phoenix test ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/phoenix-complete-test"
          mkdir -p "$OUT/android"
          APK="$RUNNER_TEMP/phoenix-engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"
          cp "$APK" "$OUT/android/Phoenix-Client-debug.apk"
          for MC_VERSION in 1.21.1; do
            unzip -l "$APK" | grep -q "assets/phoenix/phoenix-branding-fabric-$MC_VERSION.jar"
          done
          echo "Verified: the supported Phoenix 1.21.1 client build is bundled inside the APK."
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cd "$RUNNER_TEMP"
          zip -qr Phoenix-Client-Complete-Test-Package.zip phoenix-complete-test
      - name: Upload one complete Phoenix test package
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Client-Complete-Test-Package
          path: ${{ runner.temp }}/Phoenix-Client-Complete-Test-Package.zip
          if-no-files-found: error
          retention-days: 14
