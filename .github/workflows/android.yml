name: Build Phoenix Client (Integrated Java Engine)
on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenix-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build Phoenix Android launcher
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Phoenix project
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"
      - name: Checkout Amethyst Java engine source
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git "$RUNNER_TEMP/phoenix-engine"
          git -C "$RUNNER_TEMP/phoenix-engine" submodule status
      - name: Download OpenJDK 8 runtime bundle
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Apply Phoenix branding
        run: bash scripts/prepare-phoenix-engine.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/phoenix-engine"
      - name: Generate upstream language resources
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: bash scripts/languagelist_updater.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Build Phoenix debug APK
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: gradle --no-daemon --stacktrace :app_pojavlauncher:assembleDebug
      - name: Upload Phoenix APK
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-client-debug-apk
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          if-no-files-found: error
          retention-days: 14
