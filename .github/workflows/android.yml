name: Build Phoenix Client (Integrated Java Engine)
on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phoenix-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build complete Phoenix test package
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout Phoenix project
        uses: actions/checkout@v4
      - name: Validate Phoenix compatibility target and truthful support matrix
        run: python3 scripts/validate-phoenix-compatibility.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"
      - name: Set up Fabric Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Build Phoenix Fabric client adapters for Minecraft 1.21.1-1.21.11
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/phoenix-fabric-assets"
          mkdir -p "$OUT"
          for MINOR in {1..11}; do
            MC_VERSION="1.21.$MINOR"
            if [ "$MINOR" -eq 2 ]; then
              cp phoenix-branding/fabric/src/modern/resources/phoenix_branding.mixins.json phoenix-branding/fabric/src/main/resources/phoenix_branding.mixins.json
            fi
            if [ "$MINOR" -eq 6 ]; then
              cp phoenix-branding/fabric/src/modern6/java/net/phoenix/client/branding/PhoenixHud.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/PhoenixHud.java
            fi
            if [ "$MINOR" -eq 9 ]; then
              cp phoenix-branding/fabric/src/modern9/java/net/phoenix/client/branding/PhoenixHud.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/PhoenixHud.java
              cp phoenix-branding/fabric/src/modern9/java/net/phoenix/client/branding/PhoenixHudEditorScreen.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/PhoenixHudEditorScreen.java
              cp phoenix-branding/fabric/src/modern9/java/net/phoenix/client/branding/mixin/PlayerListHudMixin.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/mixin/PlayerListHudMixin.java
            fi
            if [ "$MINOR" -eq 11 ]; then
              cp phoenix-branding/fabric/src/modern11/java/net/phoenix/client/branding/PhoenixPerformanceScreen.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/PhoenixPerformanceScreen.java
              cp phoenix-branding/fabric/src/modern11/java/net/phoenix/client/branding/mixin/EntityRendererMixin.java phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/mixin/EntityRendererMixin.java
              grep -Fq 'Entity entity, double squaredDistance,' phoenix-branding/fabric/src/main/java/net/phoenix/client/branding/mixin/EntityRendererMixin.java
            fi
            echo "::group::Building Phoenix Fabric adapter for $MC_VERSION"
            DEPS="$(python3 scripts/resolve-fabric-versions.py "$MC_VERSION")"
            YARN_MAPPINGS="$(printf '%s\n' "$DEPS" | sed -n '1p')"
            FABRIC_API_VERSION="$(printf '%s\n' "$DEPS" | sed -n '2p')"
            test -n "$YARN_MAPPINGS"
            test -n "$FABRIC_API_VERSION"
            BUILD_OK=false
            for ATTEMPT in 1 2 3; do
              echo "Gradle build attempt $ATTEMPT/3 for $MC_VERSION"
              if gradle --no-daemon --retry 3 --max-workers=2 -p phoenix-branding/fabric clean build \
                -Pminecraft_version="$MC_VERSION" \
                -Pyarn_mappings="$YARN_MAPPINGS" \
                -Ploader_version=0.18.1 \
                -Pfabric_version="$FABRIC_API_VERSION" \
                -PphoenixIntegratedAdapters=true; then
                BUILD_OK=true
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                WAIT_SECONDS=$((ATTEMPT * 20))
                echo "Build failed for $MC_VERSION; retaining Gradle caches and retrying in ${WAIT_SECONDS}s."
                sleep "$WAIT_SECONDS"
              fi
            done
            if [ "$BUILD_OK" != true ]; then
              echo "::error::Phoenix Fabric adapter build failed for $MC_VERSION after 3 attempts."
              exit 1
            fi
            JAR="$(find phoenix-branding/fabric/build/libs -maxdepth 1 -type f -name 'phoenix-branding-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
            test -n "$JAR"
            jar tf "$JAR" > "$RUNNER_TEMP/phoenix-jar-contents.txt"
            for REQUIRED in fabric.mod.json phoenix_branding.mixins.json net/phoenix/client/branding/PhoenixBrandingClient.class net/phoenix/client/branding/PhoenixTitleScreen.class net/phoenix/client/branding/mixin/TitleScreenMixin.class net/phoenix/client/branding/mixin/SplashOverlayMixin.class; do
              grep -Fxq "$REQUIRED" "$RUNNER_TEMP/phoenix-jar-contents.txt"
            done
            python3 -c 'import json,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); c=json.loads(z.read("phoenix_branding.mixins.json")); p=c["package"].replace(".","/").rstrip("/"); missing=[f"{p}/{m.replace(chr(46), chr(47))}.class" for m in c.get("client",[]) if f"{p}/{m.replace(chr(46), chr(47))}.class" not in z.namelist()]; assert not missing, "Mixin classes missing from Phoenix adapter: "+", ".join(missing)' "$JAR"
            if [ "$MINOR" -eq 11 ]; then
              javap -classpath "$JAR" -p net.phoenix.client.branding.mixin.EntityRendererMixin > "$RUNNER_TEMP/phoenix-entity-renderer-mixin.txt"
              grep -F 'phoenix$showLivingHealthLabels(' "$RUNNER_TEMP/phoenix-entity-renderer-mixin.txt" | grep -Fq 'double'
              echo "Verified Minecraft 1.21.11 EntityRenderer mixin has the required double parameter."
            fi
            unzip -p "$JAR" fabric.mod.json | grep -q '"id"[[:space:]]*:[[:space:]]*"phoenix_branding"'
            cp "$JAR" "$OUT/phoenix-branding-fabric-$MC_VERSION.jar"
            echo "Built Phoenix Fabric adapter: $MC_VERSION"
            echo "::endgroup::"
          done
          test "$(find "$OUT" -maxdepth 1 -name 'phoenix-branding-fabric-*.jar' | wc -l)" -eq 11
      - name: Download exact-version AppleSkin Fabric builds
        run: python3 scripts/download-appleskin.py "$RUNNER_TEMP/phoenix-fabric-assets"
      - name: Checkout Amethyst Java engine source
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git clone --recursive --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git "$RUNNER_TEMP/phoenix-engine"
          git -C "$RUNNER_TEMP/phoenix-engine" submodule status
      - name: Download OpenJDK 8 runtime bundle (attempt 1)
        id: download_jre_attempt_1
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Retry OpenJDK 8 runtime download (attempt 2)
        id: download_jre_attempt_2
        if: steps.download_jre_attempt_1.outcome != 'success'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Retry OpenJDK 8 runtime download (attempt 3)
        if: steps.download_jre_attempt_1.outcome != 'success' && steps.download_jre_attempt_2.outcome != 'success'
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: ${{ runner.temp }}/phoenix-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - name: Apply Phoenix branding and launcher UI
        run: bash scripts/prepare-phoenix-engine.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/phoenix-engine"
      - name: Embed and verify all Phoenix Fabric adapters inside launcher assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$RUNNER_TEMP/phoenix-engine/app_pojavlauncher/src/main/assets/phoenix"
          mkdir -p "$ASSETS"
          cp "$RUNNER_TEMP"/phoenix-fabric-assets/phoenix-branding-fabric-*.jar "$ASSETS/"
          APPLESKIN_JARS=("$RUNNER_TEMP"/phoenix-fabric-assets/appleskin-fabric-*.jar)
          if [ -e "${APPLESKIN_JARS[0]}" ]; then cp "${APPLESKIN_JARS[@]}" "$ASSETS/"; fi
          for MINOR in {1..11}; do
            MC_VERSION="1.21.$MINOR"
            EMBEDDED="$ASSETS/phoenix-branding-fabric-$MC_VERSION.jar"
            test -s "$EMBEDDED"
            jar tf "$EMBEDDED" | grep -Fxq "net/phoenix/client/branding/mixin/SplashOverlayMixin.class"
            jar tf "$EMBEDDED" | grep -Fxq "net/phoenix/client/branding/mixin/TitleScreenMixin.class"
          done
          test "$(find "$ASSETS" -maxdepth 1 -name 'phoenix-branding-fabric-*.jar' | wc -l)" -eq 11
      - name: Generate upstream language resources
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: bash scripts/languagelist_updater.sh
      - name: Set up Android Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Build Phoenix Android APK
        working-directory: ${{ runner.temp }}/phoenix-engine
        run: gradle --no-daemon --stacktrace :app_pojavlauncher:assembleDebug
      - name: Assemble one complete Phoenix test ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/phoenix-complete-test"
          mkdir -p "$OUT/android" "$OUT/fabric-adapters"
          APK="$RUNNER_TEMP/phoenix-engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"
          cp "$APK" "$OUT/android/Phoenix-Client-debug.apk"
          for MINOR in {1..11}; do
            MC_VERSION="1.21.$MINOR"
            unzip -l "$APK" | grep -q "assets/phoenix/phoenix-branding-fabric-$MC_VERSION.jar"
            cp "$RUNNER_TEMP/phoenix-fabric-assets/phoenix-branding-fabric-$MC_VERSION.jar" "$OUT/fabric-adapters/"
          done
          printf '%s\n' "Minecraft 1.21.1-1.21.11" "11 version-matched Fabric adapters included" "Vanilla selection automatically prepares an isolated Fabric-backed Phoenix runtime" "Saved Vanilla profile is not overwritten; no manual mod copying." > "$OUT/TEST-NOTES.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cd "$RUNNER_TEMP"
          zip -qr Phoenix-Client-Complete-Test-Package.zip phoenix-complete-test
      - name: Upload one complete Phoenix test package
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Client-Complete-Test-Package
          path: ${{ runner.temp }}/Phoenix-Client-Complete-Test-Package.zip
          if-no-files-found: error
          retention-days: 14
